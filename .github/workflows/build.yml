name: Compilar Mod Forge 1.20.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar projeto do mod
        run: |
          ZIP_FILE=$(ls -1 *.zip | head -n 1)
          unzip -o "$ZIP_FILE"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compilar .jar
        run: gradle build --no-daemon

      - name: Disponibilizar .jar
        uses: actions/upload-artifact@v4
        with:
          name: fisica-total-1.20.1-jar
          path: build/libs/*.jar
